name: ChatCooldown
author: AhmHkn
main: me.AhmHkn.ChatCooldown.Main
description: Chat cooldown plugin.
version: 2.1.2-paper2612
api-version: 26.1.2
softdepend:
  - LunaChat
  - AntiPopup
commands:
  cdreload:
    description: Reload ChatCooldown config.
    permission: chatcooldown.reload
permissions:
  chatcooldown.bypass:
    description: Bypass chat cooldown.
    default: false
  chatcooldown.reload:
    description: Reload ChatCooldown config.
    default: op
