# Cooldown duration in seconds.
CooldownSeconds: 3.0

BypassPermission: "chatcooldown.bypass"
Prefix: "&9ChatCooldown &8&l» "
Message: "&cCalm down! &7(%time%s)"

LunaChat:
  # Native Paper/Bukkit chat events are used by default because LunaChat consumes
  # the same chat flow after those events. Enable this only if you need to cover
  # LunaChat-specific entrypoints that do not emit native chat events.
  HookPreChat: false
